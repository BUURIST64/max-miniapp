<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Банкротство граждан</title>

  <script src="https://st.max.ru/js/max-web-app.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      color: #111;
    }

    .wrapper {
      max-width: 520px;
      margin: 0 auto;
      padding: 24px;
    }

    .card {
      background: #fff;
      border-radius: 24px;
      padding: 28px 24px;
      box-shadow: 0 8px 30px rgba(0,0,0,.06);
    }

    h1 {
      margin-top: 0;
      font-size: 28px;
      line-height: 1.15;
    }

    .subtitle {
      font-size: 18px;
      line-height: 1.45;
      margin: 18px 0 26px;
    }

    .manager {
      padding: 18px;
      border-radius: 16px;
      background: #f2f3f5;
      margin-bottom: 20px;
    }

    .manager strong {
      display: block;
      font-size: 18px;
      margin-bottom: 5px;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 14px;
      padding: 16px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
    }

    .privacy {
      margin-top: 18px;
      font-size: 12px;
      line-height: 1.4;
      color: #777;
      text-align: center;
    }
  </style>
</head>

<body>

  <div class="wrapper">
    <div class="card">

      <h1>Банкротство граждан</h1>

      <div class="subtitle">
        Узнайте, какие варианты решения могут быть доступны в вашей ситуации.
      </div>

      <div class="manager">
        <strong>Специалист по вопросам задолженности</strong>
        Можно дистанционно или в офисе
      </div>

      <button onclick="openBot()">
        Посмотреть, что можно сделать
      </button>

      <div class="privacy">
        При использовании сервиса могут обрабатываться технические данные MAX,
        необходимые для работы приложения и определения источника обращения.
      </div>

    </div>
  </div>

  <script>
    const SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycbzQyaWoCmaXliVoISdh67ofzMBQ30RZE6rrLJg1NNNJ10tbT42mwA5jsPv-cuRTDVmU/exec";


    // =========================
    // СОХРАНЯЕМ ПЕРЕХОД В ТАБЛИЦУ
    // =========================

    async function saveLead(user, source) {
      const payload = {
        first_name: user.first_name || "",
        last_name: user.last_name || "",
        username: user.username || "",
        user_id: user.id || "",
        source: source || "",
        manager: "",
        public_name: ""
      };

      try {
        await fetch(SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: {
            "Content-Type": "text/plain;charset=utf-8"
          },
          body: JSON.stringify(payload)
        });
      } catch (error) {
        console.error("Ошибка сохранения лида:", error);
      }
    }


    // =========================
    // ОТКРЫВАЕМ БОТА
    // =========================

    function openBot() {
      const webApp = window.WebApp;

      const source =
        webApp?.initDataUnsafe?.start_param ||
        new URLSearchParams(window.location.search).get("WebAppStartParam") ||
        "";

      const botUrl =
        "https://max.ru/se14491443_bot?start=" +
        encodeURIComponent(source);

      if (webApp && typeof webApp.openMaxLink === "function") {
        webApp.openMaxLink(botUrl);
      } else {
        window.location.href = botUrl;
      }
    }


    // =========================
    // ПРИ ОТКРЫТИИ MINI APP
    // =========================

    try {
      const data = window.WebApp?.initDataUnsafe;
      const user = data?.user;

      if (user && user.id) {
        saveLead(user, data.start_param || "");
      }

    } catch (error) {
      console.error("Ошибка MAX:", error);
    }
  </script>

</body>
</html>
