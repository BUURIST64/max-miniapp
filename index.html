<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MAX mini app test</title>

  <script src="https://st.max.ru/js/max-web-app.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 20px;
      line-height: 1.5;
    }

    .card {
      padding: 20px;
      border: 1px solid #ddd;
      border-radius: 16px;
    }

    .value {
      font-weight: bold;
      word-break: break-word;
    }
  </style>
</head>

<body>

  <div class="card">
    <h2>Тест MAX mini app</h2>

    <p>Имя: <span class="value" id="name">—</span></p>
    <p>Фамилия: <span class="value" id="lastname">—</span></p>
    <p>Username: <span class="value" id="username">—</span></p>
    <p>MAX ID: <span class="value" id="userid">—</span></p>
    <p>Источник рекламы: <span class="value" id="source">—</span></p>

    <p id="status">Проверяем данные MAX...</p>
  </div>

  <script>
    const SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycbzQyaWoCmaXliVoISdh67ofzMBQ30RZE6rrLJg1NNNJ10tbT42mwA5jsPv-cuRTDVmU/exec";

    const status = document.getElementById("status");

    async function saveLead(user, source) {
      const payload = {
        first_name: user.first_name || "",
        last_name: user.last_name || "",
        username: user.username || "",
        user_id: user.id || "",
        source: source || "",
        manager: "",
        public_name: ""
      };

      try {
        await fetch(SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: {
            "Content-Type": "text/plain;charset=utf-8"
          },
          body: JSON.stringify(payload)
        });

        status.textContent = "Данные получены и сохранены ✅";
      } catch (error) {
        status.textContent = "Ошибка отправки данных";
        console.error(error);
      }
    }

    try {
      const data = window.WebApp?.initDataUnsafe;
      const user = data?.user;

      if (user && user.id) {

        document.getElementById("name").textContent =
          user.first_name || "не передано";

        document.getElementById("lastname").textContent =
          user.last_name || "не передано";

        document.getElementById("username").textContent =
          user.username ? "@" + user.username : "нет username";

        document.getElementById("userid").textContent =
          user.id;

        document.getElementById("source").textContent =
          data.start_param || "источник не передан";

        saveLead(user, data.start_param || "");

      } else {
        status.textContent =
          "Страница открыта вне MAX или MAX не передал данные пользователя.";
      }

    } catch (error) {
      status.textContent = "Ошибка: " + error.message;
    }
  </script>

</body>
</html>
